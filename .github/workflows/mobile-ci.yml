name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'nextstep-mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'nextstep-mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  build:
    name: Install, typecheck, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextstep-mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nextstep-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci
