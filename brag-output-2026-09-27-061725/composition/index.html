<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>myFuturely promo v3</title>
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2"); font-weight: 800; }

      :root {
        --bg: #0b1424; --screen: #0e1829; --card: #15223a; --card-2: #1b2b47; --line: #23355a;
        --text: #eaf0ff; --text-2: #aebfdd; --muted: #8699bd;
        --blue: #2f7bff; --blue-2: #5b9bff; --cyan: #22d3ee; --violet: #a78bfa; --purple: #8b5cf6;
        --green: #34d399; --amber: #fbbf24; --orange: #fb923c; --red: #f87171;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #081122; }
      .clip { position: absolute; inset: 0; }

      /* ── background ── */
      #bg-base { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 50%, #0f2248 0%, #0a1630 45%, #060d1c 100%); }
      #bg-bright { position: absolute; inset: 0; background: radial-gradient(70% 70% at 62% 62%, #2f6fd6 0%, #1c4596 38%, rgba(10,22,48,0) 75%); }
      .blob { position: absolute; border-radius: 50%; }
      #blob-a { width: 1100px; height: 1100px; left: 1100px; top: 380px; background: radial-gradient(circle, rgba(47,123,255,0.35) 0%, transparent 65%); }
      #blob-b { width: 900px; height: 900px; left: -300px; top: -350px; background: radial-gradient(circle, rgba(34,211,238,0.12) 0%, transparent 65%); }
      #vignette { position: absolute; inset: 0; background: radial-gradient(90% 80% at 50% 50%, transparent 60%, rgba(0,0,0,0.45) 100%); }

      /* ── title cards ── */
      .title-scene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
      .tline { display: flex; gap: 0.26em; font-weight: 800; font-size: 118px; letter-spacing: -3.5px; line-height: 1.08; }
      .tw { display: inline-block; }
      .acc { color: #6fb3ff; background: linear-gradient(90deg, #6fdcff 0%, #6aa4ff 55%, #aa98ff 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; padding-bottom: 0.08em; }

      /* ── logo scene ── */
      #logo-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #logo-mark { width: 230px; height: auto; display: block; filter: drop-shadow(0 0 40px rgba(34,211,238,0.45)); }
      #logo-sweep { position: absolute; width: 300px; height: 360px; overflow: hidden; }
      #sweep-bar { position: absolute; top: -60px; width: 70px; height: 480px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent); mix-blend-mode: overlay; }

      /* ── device ── */
      .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; perspective: 2600px; }
      .cam { width: 1560px; height: 960px; flex-shrink: 0; perspective: 2600px; }
      .device { position: relative; width: 1560px; height: 960px; border-radius: 46px; padding: 14px; background: linear-gradient(145deg, #2a4170 0%, #16233f 40%, #121d34 100%);
        box-shadow: inset 0 0 0 2px rgba(150,195,255,0.45), 0 0 0 1px rgba(34,211,238,0.35), 0 0 60px rgba(34,211,238,0.28), 0 0 160px rgba(47,123,255,0.28), 0 70px 140px rgba(0,0,0,0.55); }
      .screen { position: relative; width: 100%; height: 100%; border-radius: 32px; overflow: hidden; background: var(--screen); display: flex; }
      .side { width: 250px; flex-shrink: 0; background: #0b1424; border-right: 1px solid var(--line); position: relative; padding: 30px 16px; }
      .brand { display: flex; align-items: center; gap: 12px; padding: 0 12px; margin-bottom: 34px; }
      .brand img { width: 34px; height: auto; display: block; }
      .brand span { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
      .nav-hl { position: absolute; left: 16px; right: 16px; height: 50px; border-radius: 12px; background: rgba(47,123,255,0.16); border: 1px solid rgba(91,155,255,0.35); }
      .nav { position: relative; display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 14px; margin-bottom: 4px; font-size: 18px; font-weight: 500; color: var(--text-2); }
      .nav svg { width: 21px; height: 21px; flex-shrink: 0; }
      .nav.on { color: #fff; }
      .nav.on svg { color: var(--blue-2); }
      .main { flex: 1; position: relative; padding: 38px 46px; overflow: hidden; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
      .lbl { font-size: 13px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
      .h1 { font-size: 38px; font-weight: 700; letter-spacing: -0.8px; margin: 0; }

      .cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 20; }
      .cursor svg { width: 34px; height: 34px; display: block; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)); }
      .ripple { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(120,180,255,0.9); }

      .shot { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .screen { background: #0b1322; }
      /* outro */
      #out-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #out-brand { display: flex; align-items: center; gap: 30px; }
      #out-mark { width: 150px; height: auto; display: block; filter: drop-shadow(0 0 36px rgba(34,211,238,0.4)); }
      #out-word { font-size: 132px; font-weight: 800; letter-spacing: -4px; line-height: 1.1; padding-bottom: 12px; }
      #out-tag { font-size: 44px; font-weight: 600; letter-spacing: -1px; color: var(--text); margin: 26px 0 40px; }
      #out-cta { display: flex; align-items: center; gap: 20px; font-size: 28px; font-weight: 600; }
      #out-btn { display: flex; align-items: center; gap: 12px; background: #2466e0; color: #fff; padding: 20px 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(47,123,255,0.45); }
      #out-url { color: #c3d0e8; }
    </style>
  </head>
  <body>

          <img class="shot" id="d7-a" src="assets/screens/roadmap.png" alt="myFuturely roadmap" />

          <div class="cursor" id="d7-cur"><svg viewBox="0 0 24 24"><path d="M4 2l16 10-7 1.6L9.5 21z" fill="#fff" stroke="#0b1424" stroke-width="1.4" stroke-linejoin="round"/></svg><div class="ripple" id="d7-rip"></div></div>

          <img class="shot d9-t" id="d9-t4" style="opacity:0" src="assets/screens/aitype4.png" alt="" />
          <img class="shot d9-t" id="d9-t5" style="opacity:0" src="assets/screens/aitype5.png" alt="" />
          <img class="shot d9-t" id="d9-t6" style="opacity:0" src="assets/screens/aitype6.png" alt="" />
          <img class="shot d9-t" id="d9-t7" style="opacity:0" src="assets/screens/aitype7.png" alt="" />
          <img class="shot" id="d9-c" style="opacity:0" src="assets/screens/aichat.png" alt="" />
          <div class="cursor" id="d9-cur"><svg viewBox="0 0 24 24"><path d="M4 2l16 10-7 1.6L9.5 21z" fill="#fff" stroke="#0b1424" stroke-width="1.4" stroke-linejoin="round"/></svg><div class="ripple" id="d9-rip"></div></div>

      <audio id="a-click1" src="assets/sfx/click-soft.mp3" data-start="13.05" data-duration="0.37" data-track-index="12" data-volume="1"></audio>
      <audio id="a-whoosh2" src="assets/sfx/whoosh-short.mp3" data-start="13.7" data-duration="0.57" data-track-index="13" data-volume="0.9"></audio>

      <audio id="a-whoosh4" src="assets/sfx/whoosh-short.mp3" data-start="23.7" data-duration="0.57" data-track-index="12" data-volume="0.9"></audio>
      <audio id="a-whoosh5" src="assets/sfx/whoosh.mp3" data-start="25.75" data-duration="0.57" data-track-index="11" data-volume="0.9"></audio>

      <audio id="a-whoosh6" src="assets/sfx/whoosh-short.mp3" data-start="33.7" data-duration="0.57" data-track-index="11" data-volume="0.9"></audio>
      <audio id="a-whoosh7" src="assets/sfx/whoosh.mp3" data-start="35.75" data-duration="0.57" data-track-index="13" data-volume="0.9"></audio>
      <audio id="a-typing2" src="assets/sfx/typing.mp3" data-start="36.9" data-duration="1.4" data-track-index="11" data-volume="0.7"></audio>
      <audio id="a-click4" src="assets/sfx/click-soft.mp3" data-start="38.55" data-duration="0.37" data-track-index="12" data-volume="1"></audio>

    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "expo.out", P3 = "power3.inOut";
      // Screen is 1532×932 (screenshot CSS px); centre (766,466) sits at the device centre.
      const focus = (px, py, s) => ({ x: -(px - 766) * s, y: -(py - 466) * s, scale: s });
      const click = (p, at) => {
        tl.fromTo("#" + p + "-cur", { scale: 1 }, { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, at);
        tl.fromTo("#" + p + "-rip", { scale: 0.3, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.45, ease: "power2.out" }, at);
      };
      const swap = (sel, at, dur) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: dur || 0.25, ease: "power1.inOut" }, at);
      const titleCard = (ids, t0, tEnd) => {
        ids.forEach((id, i) => {
          tl.fromTo(id, { opacity: 0, y: 70, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: E }, t0 + 0.08 + i * 0.11);
        });
        tl.to(ids, { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.28, ease: "power2.in", stagger: 0.03 }, tEnd - 0.34);
      };

      // background
      tl.fromTo("#bg-bright", { opacity: 1 }, { opacity: 0.35, duration: 0.8, ease: "sine.inOut" }, 5.6);
      [[14, 16], [24, 26], [34, 36]].forEach(([a, b]) => {
        tl.to("#bg-bright", { opacity: 1, duration: 0.3, ease: "sine.out" }, a - 0.2);
        tl.to("#bg-bright", { opacity: 0.35, duration: 0.5, ease: "sine.inOut" }, b - 0.1);
      });
      tl.to("#bg-bright", { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 41.8);
      tl.fromTo("#blob-a", { x: 0, y: 0, scale: 1 }, { x: -520, y: -260, scale: 1.25, duration: 47, ease: "sine.inOut" }, 0);
      tl.fromTo("#blob-b", { x: 0, y: 0 }, { x: 380, y: 200, duration: 47, ease: "sine.inOut" }, 0);

      // 1 · tagline
      titleCard(["#s1w1", "#s1w2", "#s1w3", "#s1w4"], 0.1, 3.0);

      // 2 · logo
      tl.fromTo("#logo-mark", { opacity: 0, scale: 0.5, y: 40, rotation: -8 }, { opacity: 1, scale: 1, y: 0, rotation: 0, duration: 0.9, ease: "back.out(1.6)" }, 3.05);
      tl.fromTo("#sweep-bar", { x: -120 }, { x: 360, duration: 0.8, ease: "power2.inOut" }, 3.9);
      tl.to("#logo-mark", { scale: 1.06, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.0);
      tl.to("#logo-mark", { scale: 9, opacity: 0, duration: 0.45, ease: "power3.in" }, 5.55);

      // 3 · dashboard 6–14
      tl.fromTo("#d3-dev", { rotationX: 38, rotationY: -26, rotationZ: 6, y: 520, z: -400, opacity: 0 },
        { rotationX: 10, rotationY: -14, rotationZ: 1.5, y: 0, z: 0, opacity: 1, duration: 1.3, ease: E }, 6.0);
      tl.to("#d3-dev", { rotationX: 6, rotationY: -8, rotationZ: 0.5, duration: 1.05, ease: "sine.inOut" }, 7.3);
      tl.to("#d3-dev", { rotationX: 2, rotationY: -2, rotationZ: 0, duration: 1.0, ease: P3 }, 8.4);
      tl.fromTo("#d3-cam", { x: 0, y: 0, scale: 1 }, { ...focus(390, 230, 1.8), duration: 1.0, ease: P3 }, 8.4);
      tl.to("#d3-cam", { ...focus(900, 330, 1.25), duration: 1.0, ease: P3 }, 10.2);
      tl.to("#d3-dev", { rotationX: 6, rotationY: 10, rotationZ: -0.8, duration: 1.0, ease: P3 }, 10.2);
      tl.to("#d3-cam", { x: 180, y: 0, scale: 1.0, duration: 0.9, ease: P3 }, 11.6);
      tl.to("#d3-dev", { rotationX: 4, rotationY: -6, rotationZ: 0, duration: 0.9, ease: P3 }, 11.6);
      tl.fromTo("#d3-cur", { x: 800, y: 640, opacity: 0 }, { x: 22, y: 250, opacity: 1, duration: 0.7, ease: "power2.inOut" }, 11.8);
      swap("#d3-b", 12.45, 0.25);
      tl.to("#d3-cur", { x: 105, y: 218, duration: 0.45, ease: "power2.inOut" }, 12.5);
      click("d3", 13.05);
      tl.to("#d3-dev", { rotationY: -30, x: -300, opacity: 0, duration: 0.45, ease: "power3.in" }, 13.55);

      // 4 · title
      titleCard(["#s4w1", "#s4w2", "#s4w3"], 14.0, 16.0);

      // 5 · grades 16–24 — real What-If: Unit 4 Test 98 → 88.00% to 89.50%
